# Bygger innkjøpsportalen med ferske TCGPlayer-priser og publiserer den på GitHub Pages.
# Kjører ved hver push til main, hver natt kl. 05:00 (UTC), og manuelt fra Actions-fanen.
name: Oppdater priser og publiser

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow
        run: pip install pillow

      # Kortbildene lastes ned én gang og gjenbrukes; bare nye kort hentes senere.
      - name: Bildecache
        uses: actions/cache@v4
        with:
          path: card_img_cache
          key: card-images-${{ github.run_id }}
          restore-keys: card-images-

      - name: Hent priser og valutakurs
        run: python build_data.py

      - name: Lag bildeark (engelske kort)
        run: python build_images.py card_img_cache

      - name: Lag bildeark (japanske kort)
        run: python build_images.py card_img_cache cards-jp.json img-jp

      - name: Hent settlogoer
        run: python build_setlogos.py card_img_cache

      - name: Sett sammen nettsiden
        run: python make_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
